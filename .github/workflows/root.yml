name: Y2Y

on:
  repository_dispatch:
    types: [Y T]

jobs:
  DAU:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Node Dependencies
        run: npm install

      - name: Setup Python, yt-dlp & aria2
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg aria2
          python3 -m pip install --upgrade --force-reinstall "yt-dlp[default]"

      - name: Create Download Directory
        run: mkdir -p downloads

      # Write secrets to temporary file
      - name: Set up YouTube Cookies
        env:
          YT_COOKIES_DATA: ${{ secrets.YT_COOKIES }}
        run: |
          echo "$YT_COOKIES_DATA" > cookies.txt

      # Parallel download up to 4 files/fragments at a time with aria2c + extract thumbnails
      - name: Y D DL
        run: |
          yt-dlp \
            --cookies cookies.txt \
            --js-runtimes node \
            --downloader aria2c \
            --downloader-args "aria2c:-j 4 -x 4 -s 4" \
            -f "bestvideo[ext=mp4]+bestaudio[ext=m4a]/best[ext=mp4]/best" \
            --merge-output-format mp4 \
            --write-info-json \
            --write-thumbnail \
            --convert-thumbnails jpg \
            -o "downloads/%(playlist_index|0)s_%(title)s.%(ext)s" \
            "${{ github.event.client_payload.youtube_url }}"

      # Always delete cookies file when finished
      - name: Cleanup Cookies
        if: always()
        run: rm -f cookies.txt

      - name: Y U
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          VIDEO_TITLE: ${{ github.event.client_payload.title }}
          VIDEO_DESCRIPTION: ${{ github.event.client_payload.description }}
          VIDEO_VISIBILITY: ${{ github.event.client_payload.visibility }}
        run: node upload.js
